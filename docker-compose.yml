version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lsn-postgres
    environment:
      POSTGRES_USER: lsn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: littlesmarties
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsn"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    # Built rather than pulled: the provisioning files are copied in, because
    # Docker on this host is snap-confined and cannot bind-mount from /opt.
    build:
      context: ./grafana
    image: lsn-grafana:local
    container_name: lsn-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # No default value. An unset password stops the stack rather than quietly
      # starting a dashboard over the nursery's data with a guessable one.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-lsnadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      # Nobody should be able to create an account on it, or read it as a guest.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # The read-only database role from migration 040, not the owning user.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback only, and on 3130 rather than the 3100 the brief asked for.
      #
      # 3100 is already taken on this host by another project's server, so the
      # container simply would not start there. Publishing it on any public
      # interface is the bigger problem: Grafana's SQL panels run whatever query
      # the logged-in user writes, against a database holding children's names,
      # dates of birth and parents' phone numbers.
      #
      # Reach it over SSH:  ssh -L 3130:127.0.0.1:3130 root@<host>
      - "127.0.0.1:3130:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lsn-redis
    # No ports mapping on purpose: reachable only from this project's compose
    # network. Other projects on this host publish their own Redis, and a
    # host port here would both collide and expose a broker that has no reason
    # to be reachable from outside.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    container_name: lsn-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URL: postgresql://lsn:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/littlesmarties
      UPLOAD_DIR: ./uploads/gallery
      # Only used to span Socket.io across instances; unset runs single-instance.
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:3011:3011"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the client bundle at build time, so it must be the URL a
        # visitor's browser can reach — not a container-local address. nginx
        # proxies https://bayrotna.ae/api/v1/ to this backend, so the API is
        # same-origin and no CORS entry is needed. lib/api.ts expects this value
        # to already include /api/v1 and appends only the resource path.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://bayrotna.ae/api/v1}
        # Session recording, off unless a Hotjar site id is set in .env and the
        # image is rebuilt — NEXT_PUBLIC_* is baked at build time, so a restart
        # will not pick it up. Before switching it on, read
        # apps/frontend/components/admin/SessionRecording.tsx: recordings of
        # this panel would otherwise capture children's names and dates of
        # birth.
        NEXT_PUBLIC_HOTJAR_ID: ${NEXT_PUBLIC_HOTJAR_ID:-}
    container_name: lsn-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3083:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  grafana_data:
    driver: local
  pgdata:
    driver: local
  backend_uploads:
    driver: local
