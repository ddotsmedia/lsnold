version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lsn-postgres
    environment:
      POSTGRES_USER: lsn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: littlesmarties
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lsn-redis
    # No ports mapping on purpose: reachable only from this project's compose
    # network. Other projects on this host publish their own Redis, and a
    # host port here would both collide and expose a broker that has no reason
    # to be reachable from outside.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    container_name: lsn-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URL: postgresql://lsn:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/littlesmarties
      UPLOAD_DIR: ./uploads/gallery
      # Only used to span Socket.io across instances; unset runs single-instance.
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:3011:3011"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the client bundle at build time, so it must be the URL a
        # visitor's browser can reach — not a container-local address. nginx
        # proxies https://bayrotna.ae/api/v1/ to this backend, so the API is
        # same-origin and no CORS entry is needed. lib/api.ts expects this value
        # to already include /api/v1 and appends only the resource path.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://bayrotna.ae/api/v1}
    container_name: lsn-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3083:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local
