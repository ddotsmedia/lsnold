apiVersion: 1

providers:
  - name: LittleSmarties
    orgId: 1
    folder: Little Smarties
    type: file
    # Editable so an admin can adjust a panel in the UI; the file is the
    # starting point, not a cage.
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
